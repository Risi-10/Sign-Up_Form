<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="Main">
        <div class="Left">
            <img src="andrey-k-e16Mo3BmJ0o-unsplash.jpg" alt="Sign-up Image">
            <div class="logo">
                
                <img src="odin-lined.png" alt="Odin Logo">
                
                <div class="Odin">Odin</div>
            </div>
        </div>
        <div class="Right">
            <div class="Description">
                <p>This is not a real online service! You know you need something like this in your real life to help you realise your deepest dreams.
                Sign up now to get started.</p>
                <p>You know you want to.</p>
            </div>
            <div class="Form">
                <p>Let's do this!</p>
                <form id="myForm" action="">
                
                    <div>
                        <div>
                            <label for="name">FIRST NAME</label>
                            <input type="text" id="name" name="name">
                        </div>

                        <div>
                            <label for="email">EMAIL</label>
                            <input type="text" id="email" name="email">
                        </div>

                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="text" id="password" name="password" required>
                        </div>
                    </div>

                    <div>
                        <div>
                            <label for="lastName">LAST NAME</label>
                            <input type="text" id="lastName" name="lastName">    
                        </div>

                        <div>
                            <label for="phoneNumber">PHONE NUMBER</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber">
                        </div>
                        
                        <div>
                            <label for="confirmPassword">CONFIRM PASSWORD</label>
                            <input type="text" id="confirmPassword" name="confirmPassword" required>
                        </div>
                    </div>

                </form>
            </div>
            <div class="Submit">
                <button type="submit" form="myForm">Create Account</button>

                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
